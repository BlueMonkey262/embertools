<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>embertools</title>
<style>
:root{--bg:#1e1f22;--chrome:#191a1c;--panel:#26282c;--panel2:#2d2f34;--border:#37393f;--text:#e6e7e9;--dim:#9aa0a6;--faint:#71767c;--orange:#f2851e;--orange-deep:#e8630a;--tint:rgba(242,133,30,.12);--green:#4caf6d;--amber:#e0a92e;--radius:8px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{background:var(--bg);color:var(--text);font-family:var(--font)}.window{height:100vh;background:var(--bg);display:flex;flex-direction:column}
 .titlebar{height:38px;flex:none;position:relative;display:flex;align-items:center;justify-content:center;background:var(--chrome);border-bottom:1px solid var(--border);-webkit-app-region:drag;user-select:none}.traffic{position:absolute;left:14px;display:flex;gap:8px;-webkit-app-region:no-drag}.traffic i{width:12px;height:12px;border-radius:50%;display:block}.traffic .r{background:#ff5f57}.traffic .y{background:#febc2e}.traffic .g{background:#28c840}.wordmark{font-weight:650;font-size:13px;letter-spacing:.2px;color:var(--dim)}body.os-chrome .titlebar{display:none}
 .body{flex:1;display:flex;min-height:0}.sidebar{width:240px;flex:none;background:var(--chrome);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}.device{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer}.device .row1{display:flex;align-items:center;gap:7px}.conn{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(76,175,109,.18);flex:none}.conn.off{background:var(--faint);box-shadow:none}.device .name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.device .meta{font-size:11px;color:var(--faint);margin-top:4px;line-height:1.45}.modlist{flex:1;overflow-y:auto;padding:6px 8px}.listlabel{font-size:10px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);padding:8px 8px 6px}.mod{display:flex;gap:9px;padding:8px 8px 9px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}.mod:hover{background:var(--panel)}.mod.selected{background:var(--tint);border-left-color:var(--orange)}.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:3px}.dot.applied{background:var(--green)}.dot.available{background:transparent;border:1.5px solid var(--faint)}.dot.attention{background:transparent;border:2px solid var(--amber);box-shadow:0 0 0 2px rgba(224,169,46,.18)}.mtext{min-width:0}.mname{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}.mdesc{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.4}.badge{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--panel2);color:var(--dim);letter-spacing:.2px;white-space:nowrap}.badge.ok{background:rgba(76,175,109,.16);color:#7ed09a}.badge.warn{background:rgba(224,169,46,.16);color:var(--amber)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}.main-scroll{flex:1;overflow-y:auto;padding:28px 34px}.crumb{font-size:11px;color:var(--faint);margin-bottom:10px}.crumb b{color:var(--dim);font-weight:600}.title-row{display:flex;align-items:center;gap:12px}h1{font-size:20px;font-weight:680;letter-spacing:.1px}.chip{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--panel2);color:var(--dim);border:1px solid var(--border);letter-spacing:.3px}.chip.applied{background:rgba(76,175,109,.14);color:#7ed09a;border-color:rgba(76,175,109,.28)}.chip.warn{background:rgba(224,169,46,.14);color:var(--amber);border-color:rgba(224,169,46,.3)}.lead{margin-top:12px;font-size:13.5px;line-height:1.6;color:var(--dim);max-width:680px}.form{margin-top:26px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:22px;max-width:680px}.field{margin-bottom:20px}.field:last-child{margin-bottom:0}.field label{display:block;font-size:12px;font-weight:650;margin-bottom:7px;color:var(--text)}.field .desc{font-size:11.5px;color:var(--faint);margin-top:6px;line-height:1.45}select,input[type=text]{appearance:none;width:300px;max-width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:9px 11px;font-size:12.5px;font-family:var(--font)}select:focus,input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--tint)}.check{display:flex;align-items:flex-start;gap:9px}.check input{appearance:none;width:16px;height:16px;flex:none;margin-top:1px;border:1.5px solid var(--faint);border-radius:4px;background:var(--panel2);cursor:pointer;position:relative}.check input:checked{background:var(--orange);border-color:var(--orange)}.check input:checked:after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:8px;border:solid #1e1f22;border-width:0 2px 2px 0;transform:rotate(45deg)}.check .ctext label{margin-bottom:2px;cursor:pointer}.divider{height:1px;background:var(--border);margin:22px 0}.risk-line{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--dim)}.risk{font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:3px 9px;border-radius:999px;background:var(--panel2);color:var(--dim);border:1px solid var(--border)}.risk.low{background:rgba(76,175,109,.14);color:#7ed09a;border-color:rgba(76,175,109,.3)}.risk.medium,.risk.high{background:rgba(224,169,46,.14);color:var(--amber);border-color:rgba(224,169,46,.3)}
.console-wrap{max-width:680px;margin-top:20px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#151619}.console-head{padding:8px 11px;border-bottom:1px solid var(--border);font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.8px}.console{height:145px;overflow:auto;padding:11px;color:#b9bec3;font:11px/1.55 var(--mono);white-space:pre-wrap}.actionbar{flex:none;border-top:1px solid var(--border);background:var(--chrome);padding:14px 34px;display:flex;align-items:center;gap:12px}.actionbar .status{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actionbar .spacer{flex:1}.btn{font-family:var(--font);font-size:12.5px;font-weight:650;padding:9px 18px;border-radius:6px;border:1px solid transparent;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.btn-secondary{background:transparent;color:var(--dim);border-color:var(--border)}.btn-secondary:hover:not(:disabled){background:var(--panel);color:var(--text)}.btn-primary{background:linear-gradient(180deg,var(--orange),var(--orange-deep));color:#1a1103;box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 2px 8px rgba(232,99,10,.35)}.btn-primary:hover:not(:disabled){filter:brightness(1.06)}.spinner{display:inline-block;width:11px;height:11px;border:2px solid rgba(26,17,3,.3);border-top-color:#1a1103;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}
.offline{height:100%;display:flex;align-items:center;justify-content:center;padding:30px}.offline-card{text-align:center;max-width:420px;padding:36px 40px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)}.offline-card h1{font-size:18px}.offline-card p{margin-top:12px;color:var(--dim);font-size:13px;line-height:1.6}.offline-card .btn{margin-top:22px}@media(max-width:760px){.sidebar{width:205px}.main-scroll{padding:22px}.actionbar{padding:12px 22px}}@media(max-width:560px){.body{display:block;overflow:auto}.sidebar{width:100%;height:auto;max-height:245px}.modlist{max-height:170px}.main{min-height:430px}.main-scroll{padding:20px}.actionbar{padding:12px 20px}.actionbar .status{display:none}}
 .drop-zone{max-width:680px;margin-top:26px;padding:42px 24px;text-align:center;border:1px dashed var(--faint);border-radius:var(--radius);background:var(--panel);color:var(--dim);font-size:13px;line-height:1.6;cursor:pointer}.drop-zone:hover,.drop-zone.dragover{border-color:var(--orange);background:var(--tint)}.drop-zone .btn{margin-top:16px}.drop-zone input{display:none}.install-icon{font-size:16px;color:var(--orange)}.device-section{max-width:680px;margin-top:26px}.section-title{font-size:13px;font-weight:680;margin-bottom:10px}.power-row{display:flex;gap:10px;flex-wrap:wrap}.app-filter{width:100%;margin-bottom:10px}.app-list{height:280px;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)}.app-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--border)}.app-row:last-child{border-bottom:0}.app-pkg{min-width:0;flex:1;font:11px var(--mono);overflow:hidden;text-overflow:ellipsis}.app-row .btn{padding:6px 11px;font-size:11px}.empty{padding:18px;color:var(--faint);font-size:12px}
</style>
</head>
<body>
<div class="window" role="application" aria-label="embertools">
  <div class="titlebar"><div class="traffic"><i class="r" id="close-window" title="Close"></i><i class="y" title="Minimize"></i><i class="g" title="Maximize"></i></div><span class="wordmark">embertools</span></div>
  <div id="app" class="body"></div>
</div>
<script>
let appState={device:{connected:false,message:"Connect a Fire tablet and enable USB debugging."},mods:[]};
let selectedName="", running=false, runLog=[], formValues={}, devicePackages=[], devicePackagesLoaded=false, packageFilter="";
if(new URLSearchParams(location.search).get("chrome")==="os")document.body.classList.add("os-chrome");
const $=s=>document.querySelector(s);
const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const label=value=>String(value).replace(/[-_]/g," ").replace(/\b\w/g,c=>c.toUpperCase());
function selected(){return appState.mods.find(m=>m.name===selectedName)||appState.mods[0]}
async function loadState(){
  try{const r=await fetch("/api/state");appState=await r.json()}catch(e){appState={device:{connected:false,message:"The GUI server is unavailable."},mods:[]}}
  if(appState.device.connected&&!selected())selectedName=appState.mods[0]?.name||"";
  render();
}
function render(){
  const d=appState.device||{};
  if(!d.connected){$("#app").innerHTML=`<main class="main"><div class="offline"><div class="offline-card"><h1>Connect a Fire tablet</h1><p>${esc(d.message||"Connect a Fire tablet and enable USB debugging.")}</p><button class="btn btn-secondary" id="retry">Retry</button></div></div></main>`;$("#retry").onclick=loadState;return}
  const current=selected();
  const pane=selectedName==="__device__"?devicePane():selectedName==="install_apk"?installPane():current?mainPane(current):"<div class=offline><div class=offline-card><h1>No mods available</h1><p>This device has no compatible embertools mods.</p></div></div>";
  $("#app").innerHTML=`<aside class="sidebar"><div class="device"><div class="row1"><span class="conn"></span><span class="name">${esc(d.name||"Fire tablet")}</span></div><div class="meta">${esc(d.fireos||"Fire OS ?")} · ${esc(d.model||"unknown")}</div></div><nav class="modlist" aria-label="Available mods"><div class="listlabel">Mods</div>${appState.mods.map(sidebarMod).join("")} ${sidebarInstall()}</nav></aside><main class="main">${pane}</main>`;
  $(".device").onclick=()=>{selectedName="__device__";formValues={};devicePackagesLoaded=false;render();loadPackages()};
  document.querySelectorAll(".mod").forEach(el=>el.onclick=()=>{selectedName=el.dataset.name;formValues={};render()});
  if(selectedName==="install_apk")wireInstallPane();else if(selectedName==="__device__")wireDevicePane();else if(current)wirePane(current);
}
function sidebarMod(m){
  const applied=m.status?.applied===true||m.applied_via_embertools;
  const dot=applied?"applied":m.risk!=="low"?"attention":"available";
  const tag=m.applied_via_embertools?`<span class="badge ok">· via embertools</span>`:"";
  return `<div class="mod ${m.name===selectedName?"selected":""}" data-name="${esc(m.name)}"><span class="dot ${dot}"></span><span class="mtext"><span class="mname">${esc(m.name)} ${tag}</span><span class="mdesc">${esc(m.summary)}</span></span></div>`;
}
function sidebarInstall(){return `<div class="mod ${selectedName==="install_apk"?"selected":""}" data-name="install_apk"><span class="dot available install-icon">＋</span><span class="mtext"><span class="mname">Install APK</span><span class="mdesc">Install APKs and split packages</span></span></div>`}
function outputPanel(){return (runLog.length||running)?`<section class="console-wrap"><div class="console-head">Run output ${running?"· running":""}</div><pre class="console" id="console">${runLog.map(esc).join("\n")||"Starting…"}</pre></section>`:""}
function mainPane(m){
  const applied=m.status?.applied===true||m.applied_via_embertools;
  const risk=m.risk||"low";const chip=applied?"applied":risk!=="low"?risk+" risk":"available";
  const fields=(m.options||[]).map(o=>optionField(o,m)).join("");
  const form=fields?`<div class="form">${fields}<div class="divider"></div><div class="risk-line"><span class="risk ${esc(risk)}">${esc(risk)} risk</span><span>${m.reversible?"Fully reversible.":"This action cannot be reverted by embertools."}</span></div></div>`:`<div class="form"><div class="risk-line"><span class="risk ${esc(risk)}">${esc(risk)} risk</span><span>${m.reversible?"Fully reversible.":"This action cannot be reverted by embertools."}</span></div></div>`;
  return `<div class="main-scroll"><div class="crumb"><b>${esc(m.name)}</b> · ${esc(m.status?.detail||chip)}</div><div class="title-row"><h1>${esc(m.name)}</h1><span class="chip ${applied?"applied":risk!=="low"?"warn":""}">${esc(chip)}</span></div><p class="lead">${esc(m.summary)}</p>${form}${outputPanel()}</div><div class="actionbar"><span class="status">${running?"Working…":applied?"Applied via embertools":"Ready"} · ${esc(appState.device.model||"")}</span><span class="spacer"></span>${applied&&m.reversible?'<button class="btn btn-secondary" id="revert">Revert</button>':""}<button class="btn btn-primary" id="apply" ${running?"disabled":""}>${running?'<span class="spinner"></span>Running':"Apply"}</button></div>`;
}
function installPane(){return `<div class="main-scroll"><div class="crumb"><b>Install APK</b> · sideload over ADB</div><div class="title-row"><h1>Install APK</h1><span class="chip">ready</span></div><p class="lead">Install a regular APK or a split-APK archive. Multiple files are processed one at a time.</p><div class="drop-zone" id="drop-zone"><div>Drop .apk / .apkm / .xapk / .apks files here, or click to choose</div><input id="apk-files" type="file" multiple accept=".apk,.apkm,.xapk,.apks"><button class="btn btn-primary" id="choose-apks" ${running?"disabled":""}>Choose files</button></div>${outputPanel()}</div><div class="actionbar"><span class="status">${running?"Installing…":"Ready"} · ${esc(appState.device.model||"")}</span><span class="spacer"></span></div>`}
function devicePane(){
  const d=appState.device||{},needle=packageFilter.trim().toLowerCase();
  const visible=devicePackages.filter(p=>!needle||p.pkg.toLowerCase().includes(needle));
  const rows=devicePackagesLoaded?(visible.length?visible.map(p=>`<div class="app-row"><span class="app-pkg">${esc(p.pkg)}</span><button class="btn btn-secondary app-action" data-action="${p.enabled?"uninstall":"enable"}" data-pkg="${esc(p.pkg)}" ${running?"disabled":""}>${p.enabled?"Uninstall":"Enable"}</button></div>`).join(""):'<div class="empty">No matching third-party apps.</div>'):'<div class="empty">Loading packages…</div>';
  return `<div class="main-scroll"><div class="crumb"><b>Device</b> · ${esc(d.model||"unknown")}</div><div class="title-row"><h1>Device</h1><span class="chip">${esc(d.fireos||"Fire OS ?")}</span></div><p class="lead">${esc(d.name||"Fire tablet")} · ${esc(d.model||"unknown")} · ${esc(d.fireos||"Fire OS ?")}</p><section class="device-section"><div class="section-title">Power</div><div class="power-row"><button class="btn btn-secondary power-action" data-power="reboot" ${running?"disabled":""}>Reboot</button><button class="btn btn-secondary power-action" data-power="recovery" ${running?"disabled":""}>Reboot to recovery</button><button class="btn btn-secondary power-action" data-power="shutdown" ${running?"disabled":""}>Power off</button></div></section><section class="device-section"><div class="section-title">Apps</div><input class="app-filter" id="package-filter" type="text" placeholder="Filter packages" value="${esc(packageFilter)}"><div class="app-list">${rows}</div></section>${outputPanel()}</div><div class="actionbar"><span class="status">${running?"Working…":"Ready"} · ${esc(d.model||"")}</span><span class="spacer"></span></div>`;
}
function optionField(o,m){
  const value=formValues[o.name]??o.default??(o.type==="bool"?false:"");
  if(o.type==="bool")return `<div class="field"><div class="check"><input type="checkbox" id="opt-${esc(o.name)}" ${value?"checked":""}><span class="ctext"><label for="opt-${esc(o.name)}">${esc(o.label||o.name)}</label></span></div></div>`;
  if(o.type==="choice"){
    const stock=(m.name==="launcher_swap"&&o.name==="launcher")||(m.name==="keyboard"&&o.name==="keyboard");
    const choices=stock?["__revert__",...(o.choices||[])]:[...(o.choices||[])];
    const control=o.allow_custom?`<input list="opt-${esc(o.name)}-list" id="opt-${esc(o.name)}" value="${esc(value)}"><datalist id="opt-${esc(o.name)}-list">${choices.map(c=>`<option value="${esc(c)}">${esc(c==="__revert__"?"(stock)":label(c))}</option>`).join("")}</datalist>`:`<select id="opt-${esc(o.name)}">${choices.map(c=>`<option value="${esc(c)}" ${String(c)===String(value)?"selected":""}>${esc(c==="__revert__"?"(stock)":label(c))}</option>`).join("")}</select>`;
    const hint=stock?`<div class="desc">(stock) restores the ${m.name==="launcher_swap"?"Fire launcher":"stock keyboard"}.</div>`:(o.help?`<div class="desc">${esc(o.help)}</div>`:"");
    return `<div class="field"><label for="opt-${esc(o.name)}">${esc(o.label||o.name)}</label>${control}${hint}</div>`;
  }
  return `<div class="field"><label for="opt-${esc(o.name)}">${esc(o.label||o.name)}</label><input type="text" id="opt-${esc(o.name)}" value="${esc(value)}">${o.help?`<div class="desc">${esc(o.help)}</div>`:""}</div>`;
}
function readOptions(m){
  const out={};(m.options||[]).forEach(o=>{const el=$("#opt-"+o.name);out[o.name]=o.type==="bool"?el.checked:el.value});return out;
}
function wirePane(m){
  $("#apply").onclick=()=>run("apply",m);
  const revert=$("#revert");if(revert)revert.onclick=()=>run("revert",m);
  const consoleBox=$("#console");if(consoleBox)consoleBox.scrollTop=consoleBox.scrollHeight;
}
function wireDevicePane(){
  const filter=$("#package-filter");
  if(filter)filter.oninput=event=>{packageFilter=event.target.value;render();const next=$("#package-filter");if(next){next.focus();next.setSelectionRange(packageFilter.length,packageFilter.length)}};
  document.querySelectorAll(".app-action").forEach(button=>button.onclick=()=>runDevice(button.dataset.action,button.dataset.pkg));
  document.querySelectorAll(".power-action").forEach(button=>button.onclick=()=>{const action=button.dataset.power;const message=action==="shutdown"?"Power off the tablet?":action==="recovery"?"Reboot the tablet into recovery?":"Reboot the tablet?";if(window.confirm(message))runDevice("power",null,action)});
  const consoleBox=$("#console");if(consoleBox)consoleBox.scrollTop=consoleBox.scrollHeight;
}
function wireInstallPane(){
  const zone=$("#drop-zone"),input=$("#apk-files");if(!zone||!input)return;
  zone.onclick=()=>{if(!running)input.click()};
  $("#choose-apks").onclick=event=>{event.stopPropagation();if(!running)input.click()};
  input.onchange=()=>{installFiles(input.files);input.value=""};
  ["dragenter","dragover"].forEach(type=>zone.addEventListener(type,event=>{event.preventDefault();zone.classList.add("dragover")}));
  ["dragleave","drop"].forEach(type=>zone.addEventListener(type,event=>{event.preventDefault();zone.classList.remove("dragover")}));
  zone.addEventListener("drop",event=>{if(!running)installFiles(event.dataTransfer.files)});
  const consoleBox=$("#console");if(consoleBox)consoleBox.scrollTop=consoleBox.scrollHeight;
}
function streamJob(jobId){return new Promise((resolve,reject)=>{
  const source=new EventSource(`/api/stream/${encodeURIComponent(jobId)}`);let finished=false;
  source.onmessage=event=>{runLog.push(JSON.parse(event.data));render()};
  source.onerror=()=>{if(!finished){source.close();reject(new Error("Job stream disconnected"))}};
  source.addEventListener("done",event=>{finished=true;const result=JSON.parse(event.data);source.close();resolve(result)});
})}
async function installFiles(fileList){
  if(running)return;const files=Array.from(fileList||[]);if(!files.length)return;
  selectedName="install_apk";runLog=[];running=true;render();
  try{for(const file of files){
    runLog.push(`\n${file.name}`);render();
    const response=await fetch("/api/install",{method:"POST",body:file,headers:{"Content-Type":"application/octet-stream","X-Filename":file.name}});
    const data=await response.json();if(!response.ok)throw new Error(data.error||"Could not start install");
    const result=await streamJob(data.job_id);if(!result.ok)runLog.push(result.error||"Install failed");render();
  }}catch(e){runLog.push(String(e))}finally{running=false;render()}
}
async function loadPackages(){
  try{const response=await fetch("/api/packages");const data=await response.json();devicePackages=data.packages||[];devicePackagesLoaded=true;if(data.connected===false)runLog.push("No device connected")}catch(e){devicePackages=[];devicePackagesLoaded=true;runLog.push(String(e))}
  if(selectedName==="__device__")render();
}
async function runDevice(action,pkg,power_action){
  if(running)return;selectedName="__device__";runLog=[];running=true;render();
  try{const response=await fetch("/api/device",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,pkg,power_action})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Could not start device action");const result=await streamJob(data.job_id);if(!result.ok)runLog.push(result.error||"Device action failed")}catch(e){runLog.push(String(e))}finally{running=false;if(action!=="power")await loadPackages();else render()}
}
$("#close-window").onclick=()=>{if(window.pywebview?.api?.close)pywebview.api.close();else window.close()};
async function run(action,m){
  if(running)return;
  formValues=readOptions(m);
  if(action==="apply"&&((m.name==="launcher_swap"&&formValues.launcher==="__revert__")||(m.name==="keyboard"&&formValues.keyboard==="__revert__")))return run("revert",m);
  if(m.risk!=="low"&&!window.confirm(`${m.name} is ${m.risk} risk. Continue?`))return;
  if(action==="apply"&&m.confirm&&!window.confirm(m.confirm))return;
  runLog=[];running=true;render();
  try{
    const response=await fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,mod:m.name,opts:formValues})});
    const data=await response.json();if(!response.ok)throw new Error(data.error||"Could not start job");
    const source=new EventSource(`/api/stream/${encodeURIComponent(data.job_id)}`);
    source.onmessage=event=>{runLog.push(JSON.parse(event.data));render()};
    source.addEventListener("done",async event=>{const result=JSON.parse(event.data);if(!result.ok)runLog.push(result.error||"Job failed");source.close();running=false;await loadState()});
  }catch(e){runLog.push(String(e));running=false;render()}
}
loadState();
</script>
</body>
</html>
