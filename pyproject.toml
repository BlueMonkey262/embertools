[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "embertools"
version = "0.1.0"
description = "Modular, no-root toolkit for reclaiming Amazon Fire tablets"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []          # stdlib only; a JDK + adb are the real requirements

[project.optional-dependencies]
# `pip install embertools[gui]` upgrades `--ui` from a browser tab to a native
# window. Chrome / Edge / Brave / Chromium also give an app window with no install.
gui = ["pywebview>=5"]

[project.scripts]
embertools = "embertools.cli:main"

[project.urls]
Homepage = "https://github.com/BlueMonkey262/embertools"

[tool.setuptools.packages.find]
include = ["embertools*"]

[tool.setuptools.package-data]
"embertools" = [
    "shared/**/*",
    "models/**/*",
    "ui_app/*",
]
